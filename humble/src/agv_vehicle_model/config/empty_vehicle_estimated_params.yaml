# Empty IGV vehicle model parameters used by the Xiamen simulation.
# Values in this file are estimates unless explicitly marked as "given".
# The launch file currently mirrors these values for agv_two_axis_simulator_node.

geometry:
  length_m:
    value: 15.0
    source: given_table
  width_m:
    value: 2.98
    source: given_table
  wheel_radius_m:
    value: 0.66
    source: given_table_empty_unloaded_radius
  wheel_tread_m:
    value: 2.381384
    source: estimated_from_igv_model
  axle_positions_m:
    axle1_x: 4.65
    axle2_x: 3.0
    axle3_x: -3.0
    axle4_x: -4.65
    source: given_table_axle_to_center_of_gravity
  steering_geometry:
    steering_axles: [1, 2]
    fixed_axles: [3, 4]
    wheel_model_count: 8
    axle1_center_limit_rad: 0.5229795759
    axle2_center_limit_rad: 0.4505604976
    axle1_equivalent_ackermann_wheelbase_m: 6.1166113715
    axle2_equivalent_ackermann_wheelbase_m: 3.5527407651
    source: back_calculated_from_given_inner_outer_wheel_limits
    note: "Center limits reproduce axle1 33.0/27.4 deg and axle2 30.0/22.6 deg inner/outer angles at the estimated tread; equivalent Ackermann wheelbases are not measured mechanical dimensions."

mass_properties:
  mass_kg:
    value: 23000.0
    source: given_table
  center_of_gravity_height_m:
    value: 0.8
    source: estimated_empty_vehicle_low_platform
  center_of_gravity_x_m:
    value: 0.0
    source: estimated_centered_empty_vehicle
  center_of_gravity_y_m:
    value: 0.0
    source: estimated_centered_empty_vehicle
  yaw_inertia_kgm2:
    value: 432363.7513
    source: estimated_uniform_rectangle_corrected_from_3d_geometry
    note: "Uniform 15.0 x 2.98 m rectangle gives about 4.48e5 kg*m^2; current value uses a 0.965 correction."
  axle_load_kg:
    value: 5750.0
    source: estimated_uniform_empty_load_distribution
  wheel_load_kg:
    value: 2875.0
    source: estimated_uniform_empty_load_distribution
  front_normal_load_n:
    value: 112815.0
    source: estimated_uniform_empty_load_distribution
  rear_normal_load_n:
    value: 112815.0
    source: estimated_uniform_empty_load_distribution
  axle_normal_load_n:
    axle1: 56407.5
    axle2: 56407.5
    axle3: 56407.5
    axle4: 56407.5
    source: estimated_uniform_empty_load_distribution

tire_model:
  front_cornering_stiffness_n_rad:
    value: 400000.0
    source: estimated_heavy_industrial_tire_linear_region
  rear_cornering_stiffness_n_rad:
    value: 400000.0
    source: estimated_heavy_industrial_tire_linear_region
  axle_cornering_stiffness_n_rad:
    axle1: 200000.0
    axle2: 200000.0
    axle3: 200000.0
    axle4: 200000.0
    source: estimated_even_split_from_front_rear
  tire_friction_coefficient:
    value: 0.8
    source: estimated_dry_concrete_or_asphalt
  rolling_resistance_coefficient:
    value: 0.012
    source: estimated_solid_industrial_tire_on_hard_surface
  wheel_inertia_kgm2:
    value: 67.0824
    source: estimated_wheel_mass_and_radius

actuators:
  all_wheel_drive:
    value: true
    source: assumed_from_user_request
  max_drive_accel_mps2:
    value: 0.35
    source: given_table
  max_brake_decel_mps2:
    value: 4.0
    source: estimated_from_line_control_braking_requirement
  steer_rate_limit_radps:
    value: 0.261799
    source: given_table_15_deg_per_sec
  drive_delay_s:
    value: 0.05
    source: estimated_line_control_response
  brake_delay_s:
    value: 0.05
    source: estimated_line_control_response
  drive_time_constant_s:
    value: 0.18
    source: estimated_line_control_response
  brake_time_constant_s:
    value: 0.18
    source: estimated_line_control_response
  steer_delay_s:
    value: 0.02
    source: estimated_less_than_100ms_requirement
  steer_time_constant_s:
    value: 0.05
    source: estimated_less_than_100ms_requirement
  steer_dead_band_rad:
    value: 0.0
    source: disabled_until_measured_to_ensure_straight_line_return
  steer_backlash_rad:
    value: 0.0
    source: disabled_until_measured_to_ensure_straight_line_return
  drive_accel_dead_band_mps2:
    value: 0.02
    source: estimated_command_dead_zone
  brake_decel_dead_band_mps2:
    value: 0.05
    source: estimated_command_dead_zone
  max_drive_power_kw:
    value: 280.0
    source: same_class_kalmar_fastcharge_agv_reference

suspension_estimate:
  architecture:
    value: parallel_rubber_and_hydropneumatic_springs
    source: zpmc_sjtu_container_transfer_agv_paper_architecture_only
  active_in_planar_vehicle_model: false
  target_body_natural_frequency_hz:
    value: 1.2
    source: engineering_initial_value_not_zpmc_measured
  target_damping_ratio:
    value: 0.30
    source: engineering_initial_value_not_zpmc_measured
  calculation: "K_total=m*(2*pi*f)^2; K_wheel=K_total/8; C_wheel=2*zeta*(m/8)*(2*pi*f)"
  profiles:
    empty:
      total_vertical_stiffness_n_m: 1307525.2
      per_wheel_vertical_stiffness_n_m: 163440.6
      per_wheel_damping_n_s_m: 13006.2
    payload_20t:
      total_vertical_stiffness_n_m: 2444503.6
      per_wheel_vertical_stiffness_n_m: 305563.0
      per_wheel_damping_n_s_m: 24315.9
    payload_30_48t:
      total_vertical_stiffness_n_m: 3040280.3
      per_wheel_vertical_stiffness_n_m: 380035.0
      per_wheel_damping_n_s_m: 30242.2
    rated_70t:
      total_vertical_stiffness_n_m: 5286949.7
      per_wheel_vertical_stiffness_n_m: 660868.7
      per_wheel_damping_n_s_m: 52590.3
  note: "Design initialization only. A hydropneumatic suspension is nonlinear; replace these equivalent linear values with pressure-travel test data."

estimate_uncertainty:
  center_of_gravity_height: low_confidence
  yaw_inertia: low_confidence
  uniform_axle_load_distribution: low_confidence
  tire_cornering_stiffness: low_confidence
  dry_surface_friction: medium_confidence_scenario_value
  actuator_delays_and_nonlinearities: low_confidence
  suspension_stiffness_and_damping: low_confidence_design_initialization

load_profiles:
  files:
    - empty.param.yaml
    - payload_20t.param.yaml
    - payload_30_48t.param.yaml
    - rated_70t.param.yaml
  note: "All loaded values are estimates; see docs/estimated_vehicle_dynamics.md."

aero:
  aerodynamic_drag_coefficient:
    value: 1.10
    source: estimated_boxy_low_speed_vehicle
  frontal_area_m2:
    value: 7.936695
    source: estimated_width_times_vehicle_height
  air_density_kg_m3:
    value: 1.225
    source: standard_sea_level_air_density
